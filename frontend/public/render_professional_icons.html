window.renderAll = async function() {
  const results = {};
  for (const [filename, info] of Object.entries(ICONS)) {
    const canvas = document.createElement('canvas');
    canvas.width = info.width;
    canvas.height = info.height;
    const ctx = canvas.getContext('2d');
    
    await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, info.width, info.height);
        ctx.drawImage(img, 0, 0, info.width, info.height);
        results[filename] = canvas.toDataURL('image/png');
        resolve();
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(info.svg);
    });
  }
  return results;
};
