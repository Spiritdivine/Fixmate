<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Icon Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #ECE5DE; }
    .box-white { background: #FFFFFF; border: 1px solid #ddd; padding: 10px; margin: 10px 0; display: inline-block; border-radius: 8px; }
    .box-dark { background: #071E15; padding: 10px; margin: 10px 0; display: inline-block; border-radius: 8px; }
    .box-mint { background: #F4F6F5; padding: 10px; margin: 10px 0; display: inline-block; border-radius: 8px; }
    .box-hero { background: #071F17; padding: 10px; margin: 10px 0; display: inline-block; border-radius: 8px; }
  </style>
</head>
<body>
  <h3>Icons on White:</h3>
  <div class="box-white">
    <img src="images/email/icon-shield.png" width="40" alt="Shield">
    <img src="images/email/icon-handshake.png" width="40" alt="Handshake">
    <img src="images/email/icon-chart.png" width="40" alt="Chart">
    <img src="images/email/social-strip.png" height="20" alt="Social">
  </div>

  <h3>Icons on Dark:</h3>
  <div class="box-dark">
    <img src="images/email/icon-community.png" width="50" alt="Community">
    <img src="images/email/icon-house.png" width="20" alt="House">
  </div>

  <h3>Icon on Mint:</h3>
  <div class="box-mint">
    <img src="images/email/icon-bulb.png" width="24" alt="Bulb">
  </div>

  <h3>Hero Artisans Seamless on Dark:</h3>
  <div class="box-hero">
    <img src="images/email/hero-artisans-seamless.png" width="250" alt="Hero Seamless">
  </div>
</body>
</html>
